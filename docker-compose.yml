services:
  db:
    image: postgres:16-alpine
    container_name: kofeteriy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kofeteriy}
      POSTGRES_USER: ${POSTGRES_USER:-kofeteriy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kofeteriy}
    volumes:
      - ${POSTGRES_DATA_DIR:-/opt/kofeteriy/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    container_name: kofeteriy-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${APP_TIMEZONE:-Asia/Yekaterinburg}
      HOST: 0.0.0.0
      PORT: 8787
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-kofeteriy}
      PGUSER: ${POSTGRES_USER:-kofeteriy}
      PGPASSWORD: ${POSTGRES_PASSWORD:-kofeteriy}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-luna}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-openai/whisper-1}
      AI_TOOL_MODE: ${AI_TOOL_MODE:-json}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_TRANSCRIPTION_TIMEOUT_MS: ${AI_TRANSCRIPTION_TIMEOUT_MS:-120000}
    ports:
      - "${APP_PORT:-8787}:8787"
    volumes:
      - ${DATA_DIR:-/opt/kofeteriy/data}:/app/data
